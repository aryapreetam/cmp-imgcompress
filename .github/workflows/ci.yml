name: Reusable CI (lint, unit tests, Parikshan E2E)

on:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  lint:
    name: Lint and code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Check code style (lint)
        run: ./gradlew lintRelease

  lib-tests:
    name: Library+Sample tests (${{ matrix.target }})
    needs: [ lint ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: jvm
            os: ubuntu-latest
          - target: ios
            os: macos-latest
          - target: wasm
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Setup Node.js (for wasm)
        if: matrix.target == 'wasm'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Check for preinstalled Chrome/Chromium
        if: matrix.target == 'wasm'
        id: chromecheck
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(command -v google-chrome)" >> $GITHUB_OUTPUT
            exit 0
          fi
          if command -v chromium-browser >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(command -v chromium-browser)" >> $GITHUB_OUTPUT
            exit 0
          fi
          if command -v chromium >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(command -v chromium)" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=false" >> $GITHUB_OUTPUT
      - name: Setup Chrome for wasm tests
        if: matrix.target == 'wasm' && steps.chromecheck.outputs.found == 'false'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Export CHROME_BIN for wasm tests
        if: matrix.target == 'wasm'
        run: |
          if [ "${{ steps.chromecheck.outputs.found }}" = "true" ]; then
            echo "CHROME_BIN=${{ steps.chromecheck.outputs.path }}" >> $GITHUB_ENV
          elif [ -n "$CHROME_PATH" ]; then
            echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          fi
      - name: Cache Kotlin/Native (~/.konan)
        if: matrix.target == 'ios'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache Kotlin JS Store
        if: matrix.target == 'wasm'
        uses: actions/cache@v4
        with:
          path: kotlin-js-store
          key: kjs-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: kjs-${{ runner.os }}-
      - name: Grant Gradlew execute permission
        run: chmod +x gradlew
      - name: Run library + sample target tests
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            jvm)
              ./gradlew :cmp-imgcompress:jvmTest :sample:composeApp:jvmTest
              ;;
            ios)
              ./gradlew :cmp-imgcompress:iosSimulatorArm64Test :sample:composeApp:iosSimulatorArm64Test
              ;;
            wasm)
              ./gradlew :cmp-imgcompress:wasmJsBrowserTest :sample:composeApp:wasmJsBrowserTest
              ;;
          esac

  test-android-unit:
    name: Android unit tests (lib + sample)
    runs-on: ubuntu-latest
    needs: [ lint ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Android unit tests
        run: ./gradlew :cmp-imgcompress:testAndroid :sample:androidApp:testDebugUnitTest

  e2e-desktop-wasm:
    name: Parikshan E2E (JVM + Wasm)
    runs-on: ubuntu-latest
    needs: [ lib-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Setup Desktop E2E Environment
        uses: aryapreetam/parikshan-desktop-action@v1
        with:
          command: 'echo "Desktop setup complete."'
      - name: Setup WASM E2E Environment
        uses: aryapreetam/parikshan-wasm-action@v1
        with:
          command: 'echo "WASM setup complete."'
      - name: Run Parikshan E2E (JVM + Wasm)
        run: |
          xvfb-run ./gradlew :sample:composeApp:e2eTest --targets=jvm,wasm -Dparikshan.video.enabled=true --no-configuration-cache
      - name: Upload Desktop & Wasm Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-desktop-wasm-results
          path: |
            sample/composeApp/build/parikshan/videos/
            sample/composeApp/build/parikshan/screenshots/
            sample/composeApp/build/parikshan/*.log
            sample/composeApp/build/parikshan/logs/
            sample/composeApp/build/reports/tests/
          if-no-files-found: ignore

  e2e-android:
    name: Parikshan E2E (Android)
    runs-on: ubuntu-latest
    needs: [ lib-tests, test-android-unit ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :sample:composeApp:e2eAndroidTest -Dparikshan.video.enabled=true --no-configuration-cache
      - name: Upload Android Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-android-results
          path: |
            sample/composeApp/build/parikshan/videos/android/
            sample/composeApp/build/parikshan/screenshots/
            sample/composeApp/build/parikshan/*.log
            sample/composeApp/build/parikshan/logs/
            sample/composeApp/build/reports/tests/
          if-no-files-found: ignore

  e2e-ios:
    name: Parikshan E2E (iOS Simulator ARM64)
    runs-on: macos-latest
    needs: [ lib-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: List Available Simulators
        run: xcrun simctl list devices available
      - name: Pre-compile Kotlin Native Framework
        run: |
          ./gradlew :sample:composeApp:linkDebugFrameworkIosSimulatorArm64 \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" \
            -Pparikshan.e2e.active=true
      - name: Run Parikshan iOS E2E tests
        run: |
          ./gradlew :sample:composeApp:e2eIosTest \
            -Dparikshan.video.enabled=true \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" \
            -Dparikshan.xcodebuild.timeout=1800
      - name: Upload iOS Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-ios-results
          path: |
            sample/composeApp/build/parikshan/screenshots/
            sample/composeApp/build/parikshan/videos/
            sample/composeApp/build/parikshan/*.log
            sample/composeApp/build/parikshan/logs/
            sample/composeApp/build/reports/tests/
          if-no-files-found: ignore
